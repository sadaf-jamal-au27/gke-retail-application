name: Build & Push Images (Emergency / Manual)

# ─────────────────────────────────────────────────────────
# MANUAL-ONLY emergency build + push (no security stages).
# Use only when ci.yml is broken or for a hotfix re-push.
#
# ⚠️  Do NOT add push/pull_request triggers here — they
#     would duplicate ci.yml causing double builds and
#     double image pushes on every commit.
#
# Full DevSecOps pipeline: ci.yml
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space or comma-separated services to build (or 'all')"
        required: false
        default: "all"

env:
  PROJECT_ID: ai-rag-agent-project
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/ai-rag-agent-project/retail
  # All 12 live services that get deployed
  ALL_SERVICES: >-
    auth-service
    vehicle-catalog-service
    vehicle-inventory-service
    dealership-service
    auto-pricing-service
    test-drive-service
    auto-cart-service
    auto-order-service
    auto-finance-service
    service-appointment-service
    trade-in-service
    bff-api-service

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          set -euo pipefail

          # Manual override: build specific services or all
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input="${{ github.event.inputs.services }}"
            if [[ "$input" == "all" ]]; then
              changed="$ALL_SERVICES"
            else
              changed="$(echo "$input" | tr ',' ' ')"
            fi
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="HEAD~1"
            fi

            # If shared packages changed → rebuild everything
            if git diff --name-only "$BASE" HEAD | grep -q '^packages/'; then
              echo "Shared package changed — rebuilding all services"
              changed="$ALL_SERVICES"
            else
              changed=""
              for svc in $ALL_SERVICES; do
                if git diff --name-only "$BASE" HEAD | grep -q "^services/${svc}/"; then
                  changed="$changed $svc"
                fi
              done
            fi
          fi

          changed="$(echo $changed | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' || true)"
          echo "Services to build: $changed"

          if [[ -z "${changed// }" ]]; then
            echo "No services changed — skipping"
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
          else
            json_arr=$(echo "$changed" | tr ' ' '\n' | grep -v '^$' | jq -Rcn '[inputs]' || echo '[]')
            echo "services=$changed" >> "$GITHUB_OUTPUT"
            echo "matrix={\"service\":$json_arr}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ matrix.service }}:${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ env.REGISTRY }}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --file services/${{ matrix.service }}/Dockerfile \
            --tag "${{ steps.tag.outputs.image }}" \
            --tag "${{ steps.tag.outputs.latest }}" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from "${{ steps.tag.outputs.latest }}" \
            .

      - name: Push images
        run: |
          docker push "${{ steps.tag.outputs.image }}"
          docker push "${{ steps.tag.outputs.latest }}"
          echo "Pushed: ${{ steps.tag.outputs.image }}"

  build-storefront:
    name: Build storefront
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.services == 'all' ||
      contains(github.event.inputs.services, 'storefront')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          VITE_API_BASE=/api pnpm --filter @retail/storefront build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Upload to Cloud Storage
        run: |
          gsutil -m rsync -r -d apps/storefront/dist gs://${{ secrets.STATIC_BUCKET }}/
          gsutil web set -m index.html -e index.html gs://${{ secrets.STATIC_BUCKET }}/
        continue-on-error: true   # bucket optional — remove if using Cloud Run for frontend
