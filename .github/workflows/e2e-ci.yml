name: E2E CI

on:
  push:
    branches: [main, develop, "release/v*"]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail_app
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_app -d retail"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: retail_app
      DB_PASSWORD: retail
      DB_NAME: retail
      DB_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json — no need to set it here
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB migrations
        run: |
          export PGPASSWORD=retail
          for f in db/migrations/*.sql; do
            echo "▶ $f"
            psql -h 127.0.0.1 -U retail_app -d retail -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run E2E smoke tests
        run: |
          chmod +x testing/e2e/run-smoke.sh scripts/*.sh
          bash testing/e2e/run-smoke.sh
        continue-on-error: true   # advisory until smoke suite is fully stable
