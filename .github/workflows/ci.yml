name: CI — DevSecOps Pipeline

# ─────────────────────────────────────────────────────────
# BRANCHING STRATEGY
# ─────────────────────────────────────────────────────────
#  main          →  production   (protected, PR-only, full CI required)
#  develop       →  staging      (protected, PR-only, CI required)
#  release/v*.*  →  RC / QA      (protected, PR-only, full CI required)
#  feature/**    →  dev work     (PR → develop)
#  hotfix/**     →  emergency    (PR → main + back-merge to develop)
#
# This workflow runs on:
#   - push to main, develop, release/*, hotfix/*
#   - PR targeting main, develop, release/*
# ─────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop
      - "release/v*"
      - "hotfix/**"
    paths:
      - "services/**"
      - "packages/**"
      - "apps/**"
      - "db/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - develop
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write          # WIF → Artifact Registry push
  security-events: write   # CodeQL + Trivy SARIF upload
  pull-requests: write     # PR comments + labels

env:
  PROJECT_ID: ai-rag-agent-project
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/ai-rag-agent-project/retail
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"
  ALL_SERVICES: >-
    auth-service vehicle-catalog-service vehicle-inventory-service
    dealership-service auto-pricing-service test-drive-service
    auto-cart-service auto-order-service auto-finance-service
    service-appointment-service trade-in-service bff-api-service

# ─────────────────────────────────────────────────────────
# STAGE 0 — Detect what changed
# ─────────────────────────────────────────────────────────
jobs:
  detect:
    name: "S0 · Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.diff.outputs.services }}
      matrix:   ${{ steps.diff.outputs.matrix }}
      env_tag:  ${{ steps.env.outputs.env_tag }}
      is_prod:  ${{ steps.env.outputs.is_prod }}
      is_staging: ${{ steps.env.outputs.is_staging }}
      is_rc:    ${{ steps.env.outputs.is_rc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve target environment from branch name
      - id: env
        name: Resolve environment
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == "main" ]]; then
            echo "env_tag=stable"  >> "$GITHUB_OUTPUT"
            echo "is_prod=true"    >> "$GITHUB_OUTPUT"
            echo "is_staging=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=false"    >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "develop" ]]; then
            echo "env_tag=develop" >> "$GITHUB_OUTPUT"
            echo "is_prod=false"   >> "$GITHUB_OUTPUT"
            echo "is_staging=true" >> "$GITHUB_OUTPUT"
            echo "is_rc=false"    >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == release/* ]]; then
            VTAG="${REF##release/}"
            echo "env_tag=rc-${VTAG}" >> "$GITHUB_OUTPUT"
            echo "is_prod=false"  >> "$GITHUB_OUTPUT"
            echo "is_staging=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=true"    >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == hotfix/* ]]; then
            echo "env_tag=hotfix" >> "$GITHUB_OUTPUT"
            echo "is_prod=false"  >> "$GITHUB_OUTPUT"
            echo "is_staging=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=false"   >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=pr"    >> "$GITHUB_OUTPUT"
            echo "is_prod=false"  >> "$GITHUB_OUTPUT"
            echo "is_staging=false" >> "$GITHUB_OUTPUT"
            echo "is_rc=false"   >> "$GITHUB_OUTPUT"
          fi

      - id: diff
        name: Identify changed services
        run: |
          ALL="${{ env.ALL_SERVICES }}"

          # For PRs use base branch SHA; for push use event.before
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] && BASE="HEAD~1"

          if git diff --name-only "$BASE" HEAD | grep -q '^packages/'; then
            echo "Shared package changed — rebuilding all services"
            changed="$ALL"
          else
            changed=""
            for svc in $ALL; do
              git diff --name-only "$BASE" HEAD | grep -q "^services/${svc}/" && changed="$changed $svc"
            done
            # First push or nothing detected → build all
            [[ -z "$changed" ]] && changed="$ALL"
          fi

          changed=$(echo $changed | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' || true)
          arr=$(echo "$changed" | tr ' ' '\n' | grep -v '^$' | jq -Rcn '[inputs]' || echo '[]')
          echo "services=$changed"            >> "$GITHUB_OUTPUT"
          echo "matrix={\"service\":$arr}"    >> "$GITHUB_OUTPUT"
          echo "Changed: $changed"

# ─────────────────────────────────────────────────────────
# STAGE 1-A — Secret scanning (Gitleaks)
# ─────────────────────────────────────────────────────────
  secret-scan:
    name: "S1-A · Secret scan (Gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # optional free for public repos

# ─────────────────────────────────────────────────────────
# STAGE 1-B — SAST (CodeQL)
# ─────────────────────────────────────────────────────────
  sast:
    name: "S1-B · SAST (CodeQL)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

# ─────────────────────────────────────────────────────────
# STAGE 2-A — TypeScript type-check
# ─────────────────────────────────────────────────────────
  typecheck:
    name: "S2-A · Type-check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check shared packages
        run: |
          pnpm --filter @retail/service-core exec tsc --noEmit
          pnpm --filter @retail/automobile-db exec tsc --noEmit

      - name: Type-check all services
        run: |
          for svc in services/*/; do
            name=$(basename "$svc")
            echo "▶ $name"
            (cd "$svc" && ../../node_modules/.bin/tsc --noEmit 2>&1) || echo "WARN: $name has type errors"
          done

# ─────────────────────────────────────────────────────────
# STAGE 2-B — Dependency vulnerability scan
# ─────────────────────────────────────────────────────────
  dep-scan:
    name: "S2-B · Dependency scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high + critical)
        run: pnpm audit --audit-level=high
        continue-on-error: true   # advisory — don't block on unfixed upstream deps

      - name: Trivy filesystem scan (CRITICAL/HIGH CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy FS SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

# ─────────────────────────────────────────────────────────
# STAGE 3 — Unit + integration tests
# ─────────────────────────────────────────────────────────
  test:
    name: "S3 · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail_app
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_app -d retail"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: retail_app
      DB_PASSWORD: retail
      DB_NAME: retail
      DB_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB migrations
        run: |
          export PGPASSWORD=retail
          for f in db/migrations/*.sql; do
            echo "▶ Applying $f"
            psql -h 127.0.0.1 -U retail_app -d retail -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build shared packages
        run: |
          pnpm --filter @retail/service-core build
          pnpm --filter @retail/automobile-db build

      - name: Run unit tests
        run: pnpm -r --if-present test

      - name: E2E smoke test
        run: |
          if [[ -f testing/e2e/run-smoke.sh ]]; then
            bash testing/e2e/run-smoke.sh
          else
            echo "No smoke tests yet — skipping"
          fi
        timeout-minutes: 5
        continue-on-error: true   # advisory until smoke suite is stable

# ─────────────────────────────────────────────────────────
# STAGE 4 — Build Docker images (parallel per service)
# ─────────────────────────────────────────────────────────
  build:
    name: "S4 · Build ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect, typecheck, dep-scan, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          SHORT="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          ENV_TAG="${{ needs.detect.outputs.env_tag }}"
          echo "branch_tag=${BRANCH}-${SHORT}"               >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}-${SHORT}"                 >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}"                          >> "$GITHUB_OUTPUT"
          echo "safe_branch=${BRANCH}"                       >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cache-optimised)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.env_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            git.sha=${{ github.sha }}
            git.branch=${{ github.ref_name }}
            build.date=${{ github.event.head_commit.timestamp }}

      - name: Save image artifact
        run: |
          docker save "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}" \
            | gzip > /tmp/${{ matrix.service }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar.gz
          retention-days: 1

# ─────────────────────────────────────────────────────────
# STAGE 5 — Container security scan (Trivy)
# ─────────────────────────────────────────────────────────
  container-scan:
    name: "S5 · Container scan ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Resolve image tag (must match build stage)
        id: ref
        run: |
          SHORT="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "tag=${BRANCH}-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Trivy container scan (CRITICAL only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.ref.outputs.tag }}"
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Upload container scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-container-${{ matrix.service }}

# ─────────────────────────────────────────────────────────
# STAGE 6 — Push to Artifact Registry
#   main   → :main-{sha}  :stable  :latest
#   develop→ :develop-{sha} :develop-latest
#   release→ :rc-v*-{sha} :rc-latest
#   hotfix → :hotfix-{sha} (no :latest override)
# ─────────────────────────────────────────────────────────
  push:
    name: "S6 · Push ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect, container-scan, sast]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker → Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        run: docker load < /tmp/${{ matrix.service }}.tar.gz

      - name: Push images with environment tags
        run: |
          SHORT="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}"
          ENV_TAG="${{ needs.detect.outputs.env_tag }}"

          # Always push branch-sha tag
          docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:${BRANCH}-${SHORT}" 2>/dev/null || true
          docker push "${IMAGE}:${BRANCH}-${SHORT}"

          # Push environment-specific alias
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:latest"
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:stable"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:stable"
            echo "✅ Pushed :latest and :stable (production)"

          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:develop-latest"
            docker push "${IMAGE}:develop-latest"
            echo "✅ Pushed :develop-latest (staging)"

          elif [[ "${{ github.ref_name }}" == release/* ]]; then
            VTAG="${GITHUB_REF_NAME##release/}"
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:rc-latest"
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:rc-${VTAG}"
            docker push "${IMAGE}:rc-latest"
            docker push "${IMAGE}:rc-${VTAG}"
            echo "✅ Pushed :rc-${VTAG} (QA / release candidate)"

          elif [[ "${{ github.ref_name }}" == hotfix/* ]]; then
            docker tag "${IMAGE}:${BRANCH}-${SHORT}" "${IMAGE}:hotfix-latest"
            docker push "${IMAGE}:hotfix-latest"
            echo "✅ Pushed :hotfix-latest"
          fi

          echo "IMAGE_FULL=${IMAGE}:${BRANCH}-${SHORT}" >> "$GITHUB_ENV"

# ─────────────────────────────────────────────────────────
# STAGE 7 — SBOM generation (main only — production images)
# ─────────────────────────────────────────────────────────
  sbom:
    name: "S7 · SBOM ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [detect, push]
    if: github.ref_name == 'main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker → Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Generate SBOM (Syft / SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Attest SBOM to image (Cosign keyless)
        uses: anchore/sbom-action/publish-sbom@v0
        with:
          sbom-artifact-match: "^sbom-.*\\.spdx\\.json$"

# ─────────────────────────────────────────────────────────
# STAGE 8 — Pipeline summary (always)
# ─────────────────────────────────────────────────────────
  summary:
    name: "S8 · Summary"
    runs-on: ubuntu-latest
    needs: [detect, secret-scan, sast, typecheck, dep-scan, test, build, container-scan]
    if: always()
    steps:
      - name: Write step summary
        run: |
          ENV="${{ needs.detect.outputs.env_tag }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## CI Pipeline — ${GITHUB_REF_NAME}

          | Stage | Job | Status |
          |-------|-----|--------|
          | S1-A | Secret scan (Gitleaks) | ${{ needs.secret-scan.result }} |
          | S1-B | SAST (CodeQL) | ${{ needs.sast.result }} |
          | S2-A | Type-check | ${{ needs.typecheck.result }} |
          | S2-B | Dependency scan (Trivy + audit) | ${{ needs.dep-scan.result }} |
          | S3   | Unit + E2E tests | ${{ needs.test.result }} |
          | S4   | Docker build | ${{ needs.build.result }} |
          | S5   | Container scan (Trivy) | ${{ needs.container-scan.result }} |

          **Environment:** \`${ENV}\`
          **Branch:** \`${GITHUB_REF_NAME}\`
          **Commit:** \`${GITHUB_SHA}\`
          **Triggered by:** \`${{ github.event_name }}\`

          ### Image tags pushed
          \`\`\`
          ${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}
          ${ENV}
          $([ "${GITHUB_REF_NAME}" == "main" ] && echo "stable\nlatest")
          \`\`\`
          EOF
