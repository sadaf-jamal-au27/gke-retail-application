    image: retail/bff-api-service:local
    container_name: retail-bff
    environment:
      <<: *db-env
      PORT: "8080"
      AUTH_URL: http://auth-service:8080
      VEHICLE_CATALOG_URL: http://vehicle-catalog-service:8080
      DEALERSHIP_URL: http://dealership-service:8080
      VEHICLE_INVENTORY_URL: http://vehicle-inventory-service:8080
