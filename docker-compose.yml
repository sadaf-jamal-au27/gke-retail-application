name: retail

# ─────────────────────────────────────────────
# Common DB environment injected into every service
# ─────────────────────────────────────────────
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: retail_app
  DB_PASSWORD: retail
  DB_NAME: retail
  DB_SSL: "false"
  NODE_ENV: production

# Shared healthcheck for all services
x-svc-healthcheck: &svc-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # ── Postgres ────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_USER: retail_app
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "5432:5432"
    volumes:
      - retail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_app -d retail"]
      interval: 3s
      timeout: 5s
      retries: 15

  # ── DB migration job (runs once, exits) ─────
  migrate:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    entrypoint: >
      sh -c "
        for f in /migrations/*.sql; do
          echo \"Applying $$f\";
          PGPASSWORD=retail psql -h postgres -U retail_app -d retail -v ON_ERROR_STOP=1 -f $$f;
        done;
        echo 'Migrations complete.'
      "
    restart: "no"

  # ── Auth (3111) ──────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: retail/auth-service:local
    container_name: retail-auth
    environment:
      <<: *db-env
      PORT: "8080"
    ports:
      - "3111:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/auth/info || exit 1"]
      <<: *svc-healthcheck
    restart: unless-stopped

  # ── Vehicle Catalog (3101) ───────────────────
  vehicle-catalog-service:
    build:
      context: .
      dockerfile: services/vehicle-catalog-service/Dockerfile
    image: retail/vehicle-catalog-service:local
    container_name: retail-catalog
    environment:
      <<: *db-env
      PORT: "8080"
    ports:
      - "3101:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/vehicle-catalog/info || exit 1"]
      <<: *svc-healthcheck
    restart: unless-stopped

  # ── Dealership (3102) ────────────────────────
  dealership-service:
