      AUTO_CART_URL: http://auto-cart-service:8080
      AUTO_ORDER_URL: http://auto-order-service:8080
      AUTO_FINANCE_URL: http://auto-finance-service:8080
      SERVICE_APPOINTMENT_URL: http://service-appointment-service:8080
      TRADE_IN_URL: http://trade-in-service:8080
    ports:
      - "3090:8080"
    depends_on:
